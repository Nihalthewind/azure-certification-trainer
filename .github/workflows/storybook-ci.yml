name: Storybook CI

on:
  push:
    branches: [storybook]
  pull_request:
    branches: [storybook, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate UI and Storybook
        run: npm run validate
      - name: Check handoff documentation
        run: npm run check:docs
      - name: Install Chromium for UX tests
        run: npx playwright install --with-deps chromium
      - name: Test learning workflow
        run: npm run test-ux
      - name: Test V3 product experience
        run: npm run test:v3
      - name: Build production application
        run: npm run build:pages
      - name: Test application under Pages subpath
        run: npm run test:pages
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: error
      - name: Upload application for Pages
        if: github.ref == 'refs/heads/storybook' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages/

  deploy:
    if: github.ref == 'refs/heads/storybook' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated application
        id: deployment
        uses: actions/deploy-pages@v4
